name: Create PR with GITHUB_TOKEN

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a docs file and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: verify/token-pr-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          mkdir -p docs
          echo "run ${{ github.run_id }}" > "docs/log-${{ github.run_id }}.md"
          git add docs
          git commit -m "test: docs change by GITHUB_TOKEN"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "test: PR created by GITHUB_TOKEN" --body "CIが起動するかの検証用"
