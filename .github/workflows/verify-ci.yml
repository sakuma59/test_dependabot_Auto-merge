name: Verify CI

on:
  pull_request:
    branches:
      - main

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Show event context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "action=${{ github.event.action }}"
          echo "actor=${{ github.actor }}"
          echo "pr_user=${{ github.event.pull_request.user.login }}"
