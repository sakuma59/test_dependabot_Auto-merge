name: Create PR and approve CI with GITHUB_TOKEN

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a docs file and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: verify/token-approve-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          mkdir -p docs
          echo "run ${{ github.run_id }}" > "docs/log-${{ github.run_id }}.md"
          git add docs
          git commit -m "test: docs change by GITHUB_TOKEN"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "test: PR created and approved by GITHUB_TOKEN" --body "CIの承認までトークンでできるかの検証用"
      - name: Approve the pending CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: verify/token-approve-${{ github.run_id }}
        run: |
          for i in $(seq 1 12); do
            run_id=$(gh api "repos/${{ github.repository }}/actions/runs?branch=$BRANCH&event=pull_request" --jq '.workflow_runs[0].id // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          echo "pending run: $run_id"
          gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '{status, conclusion}'
          gh api -X POST "repos/${{ github.repository }}/actions/runs/$run_id/approve"
